name: Bug report
description: Report a reproducible problem in AI Gateway Testkit
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, customer prompts, or other sensitive data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include sanitized output and the exit code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic credentials and data only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 arm64, Go 1.24
    validations:
      required: true
